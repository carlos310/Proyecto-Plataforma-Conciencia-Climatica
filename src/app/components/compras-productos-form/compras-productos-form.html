<form class="form" (ngSubmit)="emitirGuardar()">
    <fieldset [disabled]="soloLectura" style="border:0;margin:0;padding:0;min-width:0">
    <section class="inputs">
    <div>
        <label for="total">Total compra</label>
        <input  id="total" name="total" [(ngModel)]="model.total" type="number" placeholder="Ingrese el valor total de la compra">
    </div>
    <div>
        <label for="cantidad">Cantidad del producto</label>
        <input  id="cantidad" name="cantidad" [(ngModel)]="model.cantidad" type="number" placeholder="Ingrese la cantidad comprada">
    </div>
    <div>
        <label for="fecha">Fecha</label>
        <input  id="fecha" name="fecha" [(ngModel)]="model.fecha" type="date" placeholder="Ingrese la fecha de la compra">
    </div>
    <div>
        <label for="proveedor">Proveedor</label>
        @if (proveedores.length) {
        <select id="proveedor" name="proveedor" [(ngModel)]="model.proveedor" autocomplete="off">
            <option [ngValue]="null" disabled>Seleccione un proveedor</option>
            @for (p of proveedores; track p.id) {
            <option [ngValue]="p.id">{{ p.id }} - {{ p.nombre }}</option>
            }
        </select>
        } @else {
        <input  id="proveedor" name="proveedor" [(ngModel)]="model.proveedor" type="number" autocomplete="off" placeholder="Ingrese el ID del proveedor">
        }
    </div>
    <div>
        <label for="idUsuario">ID usuario quien lo registra</label>
        <input  id="idUsuario" name="idUsuario" [(ngModel)]="model.idUsuario" type="number" autocomplete="off" placeholder="Ingrese el ID del usuario que registra la compra">
    </div>
    </section>
    </fieldset>
    @if (!soloLectura) {
    <button class="guardar" >Guardar</button>
    }

</form>
