<div class="boton-flotante">
    @if (isLoggedIn) {
    <button (click)="cerrarSesion()" class="btn-accesibilidad">
        <span>Salir</span>
    </button>
    }
    <button (click)="cambiarFuente('aumentar')" class="btn-accesibilidad">
        <i class="fas fa-plus"></i> <!-- Puedes usar un ícono de FontAwesome o texto como A+ -->
        <span>A+</span>
    </button>
    <button (click)="cambiarFuente('disminuir')" class="btn-accesibilidad">
        <span>A-</span>
    </button>
    <button [routerLink]="'/productosDashboard'" class="regresar-inicio">

        <span>P</span> 
    </button>
</div>
