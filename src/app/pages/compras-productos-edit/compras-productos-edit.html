<main>
    <button onclick="window.location.href='/compras-productos-edit'" class="regresar-inicio">💧</button>
    <section class="form">
        <div>
            <label for="id">ID de la compra</label>
            <input class="id" type="number" name="id" [(ngModel)]="id" placeholder="Ingrese el ID de la compra a editar">
        </div>
        <div>
            <label for="fecha">Fecha de la compra</label>
            <input class="fecha" type="date" name="fecha" [(ngModel)]="fecha" placeholder="Ingrese el fecha de la compra a editar">
        </div>
        <button class="buscar" (click)="buscar()">Buscar</button>
        @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
        }
    </section>
    <app-compras-productos-form [registro]="registro" (guardar)="guardar($event)"></app-compras-productos-form>
</main>
