<main>
    <button onclick="window.location.href='/borrarProductos'" class="regresar-inicio">💧</button>
    <section class="form">
        <div>
            <label for="id">ID del producto</label>
            <input class="id" type="number" name="id" [(ngModel)]="id" placeholder="Ingrese el ID del producto a borrar">
        </div>
        <div>
            <label for="nombre">Nombre del producto</label>
            <input class="nombre" type="text" name="nombre" [(ngModel)]="nombre" placeholder="Ingrese el nombre del producto a borrar">
        </div>
        <button class="buscar" (click)="buscar()">Buscar</button>
        @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
        }
    </section>
    <app-porductos-main-form [registro]="registro" [soloLectura]="true"></app-porductos-main-form>
    @if (registro) {
    <button class="guardar" (click)="borrar()">Borrar</button>
    }
</main>
