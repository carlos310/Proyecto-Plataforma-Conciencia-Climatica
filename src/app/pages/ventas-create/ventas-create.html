<div class="container">
  <h2>Crear Venta</h2>
  <form (ngSubmit)="crear()">
    <div class="form-group">
      <label for="total">Total:</label>
      <input type="number" id="total" [(ngModel)]="formData.total" name="total" step="0.01" required />
    </div>
    <div class="form-group">
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" [(ngModel)]="formData.cantidad" name="cantidad" required />
    </div>
    <div class="form-group">
      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" [(ngModel)]="formData.fecha" name="fecha" required />
    </div>
    <div class="form-group">
      <label for="clienteId">ID del Cliente:</label>
      <input type="number" id="clienteId" [(ngModel)]="formData.clienteId" name="clienteId" required />
    </div>
    <button type="submit" class="btn-primary">Crear</button>
  </form>
  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }
</div>
