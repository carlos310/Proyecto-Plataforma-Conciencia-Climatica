<div class="container">
  <h2>Crear Cliente</h2>
  <form (ngSubmit)="crear()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="form.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" [(ngModel)]="form.apellido" name="apellido" required />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" [(ngModel)]="form.email" name="email" required />
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" [(ngModel)]="form.telefono" name="telefono" required />
    </div>
    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" [(ngModel)]="form.direccion" name="direccion" required />
    </div>
    <div class="form-group">
      <label for="rol">Rol:</label>
      <select id="rol" [(ngModel)]="form.rol" name="rol">
        <option value="cliente">Cliente</option>
        <option value="empleado">Empleado</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Crear</button>
  </form>
  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }
</div>
