<div class="container">
  <h2>Crear Empleado</h2>
  <form (ngSubmit)="crear()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="form.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" [(ngModel)]="form.apellido" name="apellido" required />
    </div>
    <div class="form-group">
      <label for="cargo">Cargo:</label>
      <input type="text" id="cargo" [(ngModel)]="form.cargo" name="cargo" required />
    </div>
    <div class="form-group">
      <label for="salario">Salario:</label>
      <input type="number" id="salario" [(ngModel)]="form.salario" name="salario" required />
    </div>
    <div class="form-group">
      <label for="fecha_contratacion">Fecha de Contratación:</label>
      <input type="date" id="fecha_contratacion" [(ngModel)]="form.fecha_contratacion" name="fecha_contratacion" required />
    </div>
    <div class="form-group">
      <label for="rol">Rol:</label>
      <select id="rol" [(ngModel)]="form.rol" name="rol">
        <option value="empleado">Empleado</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Crear</button>
  </form>
  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }
</div>
