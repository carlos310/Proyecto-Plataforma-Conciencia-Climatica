<div class="container">
  <h2>Eliminar Cliente</h2>

  <div class="search-section">
    <div class="form-group">
      <label for="idBusqueda">Buscar por ID:</label>
      <input type="number" id="idBusqueda" [(ngModel)]="idBusqueda" name="idBusqueda" />
    </div>
    <div class="form-group">
      <label for="nombreBusqueda">O por Nombre:</label>
      <input type="text" id="nombreBusqueda" [(ngModel)]="nombreBusqueda" name="nombreBusqueda" />
    </div>
    <button type="button" (click)="buscar()" class="btn-primary">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <div class="registro-info">
    <h3>{{ registro.cli_nombre }} {{ registro.cli_apellido }}</h3>
    <p><strong>Email:</strong> {{ registro.cli_email }}</p>
    <p><strong>Teléfono:</strong> {{ registro.cli_telefono }}</p>
    <p><strong>Dirección:</strong> {{ registro.cli_direccion }}</p>
    <p><strong>Rol:</strong> {{ registro.cli_rol }}</p>
    <button type="button" (click)="borrar()" class="btn-delete">Eliminar</button>
  </div>
  }
</div>
