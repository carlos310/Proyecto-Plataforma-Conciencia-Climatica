<div class="container">
  <h2>Crear Proveedor</h2>
  <form (ngSubmit)="crear()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="formData.nombre" name="nombre" autocomplete="organization" required />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" [(ngModel)]="formData.email" name="email" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" [(ngModel)]="formData.telefono" name="telefono" autocomplete="tel" />
    </div>
    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" [(ngModel)]="formData.direccion" name="direccion" autocomplete="address-line1" />
    </div>
    <div class="form-group">
      <label for="ciudad">Ciudad:</label>
      <input type="text" id="ciudad" [(ngModel)]="formData.ciudad" name="ciudad" autocomplete="address-level2" />
    </div>
    <div class="form-group">
      <label for="pais">País:</label>
      <input type="text" id="pais" [(ngModel)]="formData.pais" name="pais" autocomplete="country-name" />
    </div>
    <div class="form-group">
      <label for="contacto">Contacto:</label>
      <input type="text" id="contacto" [(ngModel)]="formData.contacto" name="contacto" autocomplete="name" />
    </div>
    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" [(ngModel)]="formData.estado" name="estado" autocomplete="off">
        <option value="ACTIVO">Activo</option>
        <option value="INACTIVO">Inactivo</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Crear</button>
  </form>
  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }
</div>
