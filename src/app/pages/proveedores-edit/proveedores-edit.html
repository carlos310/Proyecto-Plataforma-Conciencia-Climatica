<div class="container">
  <h2>Editar Proveedor</h2>
  <div class="search-section">
    <div class="form-group">
      <label for="id">ID del Proveedor:</label>
      <input type="number" id="id" [(ngModel)]="id" name="id" />
    </div>
    <button type="button" class="btn-primary" (click)="buscar()">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <form (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="formData.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" [(ngModel)]="formData.email" name="email" required />
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="text" id="telefono" [(ngModel)]="formData.telefono" name="telefono" />
    </div>
    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" [(ngModel)]="formData.direccion" name="direccion" />
    </div>
    <div class="form-group">
      <label for="ciudad">Ciudad:</label>
      <input type="text" id="ciudad" [(ngModel)]="formData.ciudad" name="ciudad" />
    </div>
    <div class="form-group">
      <label for="pais">País:</label>
      <input type="text" id="pais" [(ngModel)]="formData.pais" name="pais" />
    </div>
    <div class="form-group">
      <label for="contacto">Contacto:</label>
      <input type="text" id="contacto" [(ngModel)]="formData.contacto" name="contacto" />
    </div>
    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" [(ngModel)]="formData.estado" name="estado">
        <option value="ACTIVO">Activo</option>
        <option value="INACTIVO">Inactivo</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Guardar Cambios</button>
  </form>
  }
</div>
