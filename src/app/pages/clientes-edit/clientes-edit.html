<div class="container">
  <h2>Editar Cliente</h2>

  <div class="search-section">
    <div class="form-group">
      <label for="idBusqueda">Buscar por ID:</label>
      <input type="number" id="idBusqueda" [(ngModel)]="idBusqueda" name="idBusqueda" />
    </div>
    <div class="form-group">
      <label for="nombreBusqueda">O por Nombre:</label>
      <input type="text" id="nombreBusqueda" [(ngModel)]="nombreBusqueda" name="nombreBusqueda" />
    </div>
    <button type="button" (click)="buscar()" class="btn-primary">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <form (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="form.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" [(ngModel)]="form.apellido" name="apellido" required />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" [(ngModel)]="form.email" name="email" required />
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" [(ngModel)]="form.telefono" name="telefono" required />
    </div>
    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" [(ngModel)]="form.direccion" name="direccion" required />
    </div>
    <div class="form-group">
      <label for="rol">Rol:</label>
      <select id="rol" [(ngModel)]="form.rol" name="rol">
        <option value="cliente">Cliente</option>
        <option value="empleado">Empleado</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Guardar</button>
  </form>
  }
</div>
