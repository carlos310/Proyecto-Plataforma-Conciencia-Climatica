<div class="container">
  <h2>Eliminar Proveedor</h2>
  <div class="search-section">
    <div class="form-group">
      <label for="id">ID del Proveedor:</label>
      <input type="number" id="id" [(ngModel)]="id" name="id" />
    </div>
    <button type="button" class="btn-primary" (click)="buscar()">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <div class="registro-info">
    <h3>Proveedor a Eliminar:</h3>
    <p><strong>ID:</strong> {{ registro.id }}</p>
    <p><strong>Nombre:</strong> {{ registro.nombre }}</p>
    <p><strong>Email:</strong> {{ registro.email }}</p>
    <p><strong>Teléfono:</strong> {{ registro.telefono }}</p>
    <p><strong>Dirección:</strong> {{ registro.direccion }}</p>
    <p><strong>Estado:</strong> {{ registro.estado }}</p>
    <button type="button" class="btn-delete" (click)="borrar()">Eliminar Proveedor</button>
  </div>
  }
</div>
