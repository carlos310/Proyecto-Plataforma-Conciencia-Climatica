<div class="container">
  <h2>Editar Empleado</h2>
  <div class="search-section">
    <div class="form-group">
      <label for="id">ID del Empleado:</label>
      <input type="number" id="id" [(ngModel)]="id" name="id" />
    </div>
    <button type="button" class="btn-primary" (click)="buscar()">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <form (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="formData.nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" [(ngModel)]="formData.apellido" name="apellido" required />
    </div>
    <div class="form-group">
      <label for="cargo">Cargo:</label>
      <input type="text" id="cargo" [(ngModel)]="formData.cargo" name="cargo" required />
    </div>
    <div class="form-group">
      <label for="salario">Salario:</label>
      <input type="number" id="salario" [(ngModel)]="formData.salario" name="salario" step="0.01" />
    </div>
    <div class="form-group">
      <label for="fechaContratacion">Fecha de Contratación:</label>
      <input type="date" id="fechaContratacion" [(ngModel)]="formData.fechaContratacion" name="fechaContratacion" />
    </div>
    <div class="form-group">
      <label for="rol">Rol:</label>
      <select id="rol" [(ngModel)]="formData.rol" name="rol">
        <option value="empleado">Empleado</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Guardar Cambios</button>
  </form>
  }
</div>
