<div class="container">
  <h2>Eliminar Empleado</h2>
  <div class="search-section">
    <div class="form-group">
      <label for="id">ID del Empleado:</label>
      <input type="number" id="id" [(ngModel)]="id" name="id" />
    </div>
    <button type="button" class="btn-primary" (click)="buscar()">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <div class="registro-info">
    <h3>Empleado a Eliminar:</h3>
    <p><strong>ID:</strong> {{ registro.id }}</p>
    <p><strong>Nombre:</strong> {{ registro.emp_nombre }}</p>
    <p><strong>Apellido:</strong> {{ registro.emp_apellido }}</p>
    <p><strong>Cargo:</strong> {{ registro.emp_cargo }}</p>
    <p><strong>Salario:</strong> {{ registro.emp_salario }}</p>
    <p><strong>Rol:</strong> {{ registro.emp_rol }}</p>
    <button type="button" class="btn-delete" (click)="borrar()">Eliminar Empleado</button>
  </div>
  }
</div>
