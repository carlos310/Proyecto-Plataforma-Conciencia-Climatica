<div class="container">
  <h2>Eliminar Venta</h2>
  <div class="search-section">
    <div class="form-group">
      <label for="id">ID de la Venta:</label>
      <input type="number" id="id" [(ngModel)]="id" name="id" />
    </div>
    <button type="button" class="btn-primary" (click)="buscar()">Buscar</button>
  </div>

  @if (mensaje) {
  <p class="mensaje">{{ mensaje }}</p>
  }

  @if (registro) {
  <div class="registro-info">
    <h3>Venta a Eliminar:</h3>
    <p><strong>ID:</strong> {{ registro.id }}</p>
    <p><strong>Total:</strong> {{ registro.total }}</p>
    <p><strong>Cantidad:</strong> {{ registro.cantidad }}</p>
    <p><strong>Fecha:</strong> {{ registro.fecha }}</p>
    <p><strong>ID Cliente:</strong> {{ registro.cli_id }}</p>
    <button type="button" class="btn-delete" (click)="borrar()">Eliminar Venta</button>
  </div>
  }
</div>
