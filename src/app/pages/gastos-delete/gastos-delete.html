<main>
    <button onclick="window.location.href='/gastos-delete'" class="regresar-inicio">💧</button>
    <section class="form">
        <div>
            <label for="id">ID del gasto</label>
            <input class="id" type="number" name="id" [(ngModel)]="id" placeholder="Ingrese el ID del gasto a borrar">
        </div>
        <div>
            <label for="fecha">Fecha del gasto</label>
            <input class="fecha" type="date" name="fecha" [(ngModel)]="fecha" placeholder="Ingrese la Fecha del gasto a borrar">
        </div>
        <button class="buscar" (click)="buscar()">Buscar</button>
        @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
        }
    </section>
    <app-gastos-form [registro]="registro" [soloLectura]="true"></app-gastos-form>
    @if (registro) {
    <button class="guardar" (click)="borrar()">Borrar</button>
    }
</main>
