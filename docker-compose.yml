services:
  postgres:
    image: postgres:16-alpine
    container_name: conciencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conciencia_climatica
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conciencia_climatica"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conciencia-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: conciencia-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conciencia_climatica
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conciencia-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: conciencia-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - conciencia-network

volumes:
  postgres_data:

networks:
  conciencia-network:
    driver: bridge